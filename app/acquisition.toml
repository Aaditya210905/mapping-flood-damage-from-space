# Acquisition policy. No event measurements or credentials belong here.
version = "acquisition-v4"
default_provider = "auto"
cdse_stac_url = "https://stac.dataspace.copernicus.eu/v1/search"
cdse_process_url = "https://sh.dataspace.copernicus.eu/process/v1"
cdse_token_url = "https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token"
osm_url = "https://api.ohsome.org/v1"
osm_v2_url = "https://api.heigit.org/ohsome-api/v2-rc"
public_stac_url = "https://planetarycomputer.microsoft.com/api/stac/v1/search"
public_sign_url = "https://planetarycomputer.microsoft.com/api/sas/v1/sign"
public_dem_base_url = "https://copernicus-dem-30m.s3.amazonaws.com"
public_geoid_url = "https://cdn.proj.org/us_nga_egm08_25.tif"
ems_activation_url = "https://rapidmapping.emergency.copernicus.eu/backend/dashboard-api/public-activations/"
public_catalog_page_size = 100
public_catalog_max_pages = 20
public_catalog_timeout_seconds = 90
public_sign_timeout_seconds = 45
public_download_timeout_seconds = 90
public_http_retries = 3
public_max_retry_wait_seconds = 10
public_gdal_timeout_seconds = 90
public_gdal_cache_mb = 64
osm_timeout_seconds = 240
osm_connect_timeout_seconds = 20
osm_http_retries = 2
osm_max_retry_wait_seconds = 10
reference_timeout_seconds = 90
optical_warning_age_days = 12
catalog_page_size = 100
catalog_max_pages = 10
catalog_timeout_seconds = 60
process_timeout_seconds = 240
http_retries = 2
max_retry_wait_seconds = 10
token_expiry_margin_seconds = 30
token_timeout_seconds = 30
reference_download_timeout_seconds = 120
minimum_scene_coverage = 0.98
radar_repeat_days = 12
radar_pre_gap_weight = 0.3
radar_repeat_weight = 0.4
optical_day_weight = 1.5
optical_pass_tolerance_seconds = 600
radar_pass_tolerance_seconds = 180
scene_window_before_seconds = 30
scene_window_after_seconds = 60
terrain_ray_steps = 64
trace_settlement_buffer_m = 1000
