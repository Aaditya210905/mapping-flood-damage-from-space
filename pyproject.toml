[project]
name = "flood-lens"
version = "0.1.0"
description = "Evidence-grounded satellite flood impact and road-access mapping"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "rasterio>=1.4,<2",
  "shapely>=2.1,<3",
  "pyproj>=3.6,<4",
  "networkx>=3.3,<4",
  "pillow>=11,<13",
  "scikit-learn>=1.6,<2",
  "reportlab>=4,<6",
  "pyarrow>=18,<27",
  "sarsen>=0.9.6,<0.10",
  "pyogrio>=0.11,<1",
  "geopandas>=1.1,<2",
]

[dependency-groups]
dev = [
  "playwright>=1.63.0",
  "pytest>=8,<10",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
